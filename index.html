<script>
const md="# SaaS Video Prompt Library\n\nStudied (2026-10-08):\n- all 232 entries on prompt-motion.com,\n- the 513-video GitHub list \"awesome-opus5-5-videos\" (333 prompts not on the site; 222 of them motion or explainer),\n- the 29 X posts we saved, with the creators' own replies,\n- \"motionmaxxing\", a pro skill built from 53 real studio films measured frame by frame.\n\nEvery line below comes from a real prompt or that skill, lightly cleaned up. Mix and match.\n\n## 0. Your taste (start here)\n\nYou picked 4 films. They all share one look:\n- **One continuous take.** No cuts. Each scene grows out of the last one.\n- **Things change shape** instead of fading: a pill becomes a spinner, a dot becomes a button, a shape floods the screen.\n- **A cursor does the work.** Real clicks and drags drive every change.\n- **Light, warm stage, black UI, one accent color.** Apple-keynote calm, not loud.\n- **Music drives it.** The big moment lands on the drop.\n\nYour picks:\n- Ajith: the one-line \"showreel\" prompt (x.com/ajith_io/status/2103449416325890146).\n- Mafi: the \"Apple showreel\" all-purpose promo prompt (x.com/chungmuromafia/status/2105675998109065701).\n- Ultima: the \"one continuous take\" template. The rossaxbt post was deleted. Same template lives at x.com/ultimaxbt/status/2107848446556123449.\n- Prompt Motion: the photo-print app film (twoclipping).\n\nSo preset **8. ONE-TAKE MORPH** below is your default. The ready **Roommie** prompt is in section E.\n\nHow to use:\n1. Pick a **style preset** (section A).\n2. Paste the **universal prompt** (section B) and fill the [brackets].\n3. Swap in extra lines from the **category banks** (section C) to push a look further.\n\nWhat the site teaches, in one breath:\n- The most copied prompt (about 60 of 232) is the one-liner \"make a dynamic 15-second motion graphics video that shows what an incredible motion designer you are, like it's your showreel for a r\u00e9sum\u00e9. go all out.\" It works because it gives a role, a length, a bar and permission.\n- The best SaaS films are the long ones. They all share 8 parts: inputs, direction, banned list, beat-timed structure, build rules, gotchas, a check-your-own-frames loop, and \"show me stills first\".\n- Short prompts make flashy reels. Long prompts make films that look like the real product.\n\n---\n\n## A. Style presets\n\nTell me one of these by name. Each one is a block you drop into the universal prompt.\n\n### 1. CLEAN MINIMAL (Apple / Linear / Stripe)\nHigh-end minimal. One idea per shot, lots of empty space, one accent color, one clean sans (Geist or Inter) with tight tracking. Warm off-white canvas, black UI. Masked type reveals, match cuts, one smooth camera language. Critically damped springs, overshoot below 2%. The visual confidence should come from restraint. Most ideas last about one second, but transitions stay smooth.\nBanned: shockwave rings, particle bursts, RGB split, camera shake, lens flares, neon glows, grid floors, flashing backgrounds, bouncy easing, crossfades.\n\n### 2. LOUD & COLORFUL (high-energy social launch)\nBold, dynamic, fast. Huge kinetic type, hard light/dark switches, a new idea every 1.5\u20132 s, a sound on every hit. Bright brand colors that flood the whole frame and contract into the next scene. Quick cuts on the beat, whip pans with motion blur, a hook in the first second. Squash and stretch, smear frames, follow-through. Social energy. Make it feel juicy.\nBanned: dead holds longer than 1 s, slow fades, anything that looks like a template, a glorified PowerPoint.\n\n### 3. LIQUID GLASS AI-LAB (OpenAI / Anthropic launch feel)\nWhite canvas, one typeface, black ink, real images, captions typed word by word as they are spoken. Every control (prompt bar, panel, pill) is liquid glass: frost the scene behind it, bend it at the edge like thick glass, add a top sheen, bright rim and soft lift shadow. A slow pastel aura in brand colors behind the glass. Camera always drifting (push 1.0 \u2192 1.04 per scene). Nothing pops in: eased fades of at least 0.3 s.\nBanned: selection-box highlights, white flashes, 3D, templates.\n\n### 4. DARK PREMIUM (fintech / dev tool / \"expensive\")\nNear-black navy, one precious accent color (like gold) used sparingly. Think dark metal, glass, ink, precision, quiet confidence. Soft rim light, faint bloom, a soft highlight passing across a surface, restrained vignette, subtle grain. Camera like a macro product shoot of a physical object. Numbers in a mono font, tactile and precise.\nBanned: cyberpunk, crypto, neon, gaming, generic AI purple, rainbow gradients, particle spam, fake glass everywhere.\n\n### 5. PAPER & MARKER (playful, human, explainer)\nPaper-light canvas, marker notes that draw on, hand-drawn arrows, real physics, huge kinetic type, a handwriting font drawn stroke by stroke. Hard light/dark switches. Feels made by a person, not a template.\nBanned: stock footage, glossy 3D, glows.\n\n### 6. UI MORPH LOOP (Dribbble-level micro-interactions)\nOne shape, never cut: every state is the same element morphing its size, radius and color while its content swaps with a short blur. A cursor drives every change with real clicks and drags. Light warm-gray canvas, black and white parts, one UI font. Springs everywhere, a tiny overshoot at most. The camera zooms so each state fills the frame. The last frame is the first frame, so it loops.\nBanned: bouncy easing, particles, glows, gradients on UI, mismatched icon strokes, dead time.\n\n### 7. CINEMATIC 3D (depth, light, product as object)\nReal depth: perspective tilts that settle to front view, soft parallax, foreground and background layers, depth of field. The product UI floats as a dimensional surface, lit like an object. Camera pushes through interface layers and pulls out to space. Controlled motion blur on the fastest moves.\nBanned: pointless spinning 3D cards, constant zooming, excessive blur that hides the UI.\n\n### 8. ONE-TAKE MORPH (your pick: Apple keynote, one camera, no cuts)\nAn Apple-keynote launch film, 2D only, one continuous take. Nothing cuts: each scene grows from the one before it, and every gesture carries the camera into the next space. Each morph takes about 0.8 s on cubic-bezier(.45,0,.15,1), and the camera zoom follows the same curve so the shape changes feel almost invisible. Content dissolves during the second half of each glide. One gesture per scene. Objects change shape instead of fading: text rises out of a mask line, icons pop from zero on a spring, a black shape floods the frame and contracts into the next scene. Warm light stage (#f3f3f0 to #e3e3de), black UI, one accent color, Geist for UI. A real macOS cursor drives every change with clicks, drags and long-presses, and the camera zooms screen-studio style so each moment fills the frame. Soft layered shadows that grow as shapes lift. Place all scenes side by side in one world so every pan really travels. Floods grow from the point that caused them to the farthest corner in about 0.4 s. Before the drop, play the song muffled, like it's in the next room; open it up on the drop. Last frame = first frame, so it loops.\nBanned: hard cuts, crossfades, blur-ins, bouncy springs, particles, glows, 3D flips, zooming in and right back out, holds longer than 1 s, anything that looks like a template.\n\n### Two schools (know which one you want)\nThe prompts and the pro skill disagree on a few things. Pick on purpose:\n- **Prompt school** (your picks): a dot that becomes the logo, a color flood between scenes, a typed prompt, one carried object pinned through the film. Feels slick and \"designed\".\n- **Pro skill school** (measured on real studio films): bans exactly those as AI habits. Wants the idea to come from the brand, hard cuts on motion, small endings, real product screens, and lots of stillness used on purpose.\n- My advice: use your preset 8 for the look, and borrow the pro rules for timing, endings and \"no fake UI\" (section F).\n\n---\n\n## B. Universal prompt (fill the brackets)\n\n```\nYou are a world-class motion designer, product designer and director. Make a [15\u201330]-second launch film for [PRODUCT] \u2014 [ONE-LINE PROMISE] for [AUDIENCE].\n\nRESEARCH FIRST\nRead the landing page and product first. Pull the real story, copy, colors, fonts and logo (trace the logo to SVG). Use the actual UI, but rebuild it as separate parts so each part can animate. Never use raw screenshots. Do not invent features, numbers, customers or results.\n\nSTYLE\n[PASTE ONE PRESET FROM SECTION A]\n\nSTORY\nOne continuous thought, not a feature list: [PROBLEM] \u2192 [THE MOMENT IT CLICKS] \u2192 [WHAT YOU GET] \u2192 [LOGO]. About 4 visual ideas total. One shot = one idea. Hook in the first second. First product moment by 2 seconds. No five-second logo intro.\n\nCAMERA\nOne continuous camera over one world. Never two camera moves at once. Every shot enters already moving and leaves on an accelerating move or a blur ramp. Push in to make a moment fill the frame, like a screen recording zoom.\n\nMOTION\nReal easing only, never linear (like cubic-bezier(0.16, 1, 0.3, 1)). Elements arrive at slightly different times and overlap. Anticipation, small overshoot, settle. Motion blur follows speed and direction. Keep each scene on screen long enough to read.\n\nTRANSITIONS\nEvery scene is made out of the previous one: a card becomes the next card, a chart line becomes a connector, a button grows into the next screen, a shape floods the frame and contracts into the next scene. The viewer should think \"of course the next scene came from that.\" No crossfades, random wipes, spins or glitches.\n\nTYPE\nVery little copy, one line at a time, max 3\u20134 words. Type moves as designed objects, rises out of a mask line. Outgoing text leaves before incoming text takes the same space. No full stops on screen.\n\nSOUND\nMusic around 120 BPM with a clear drop. Every cut on a downbeat, every UI hit on a beat, the drop on the hero moment. One soft sound per action (click, key tick, whoosh, soft impact), placed by its peak, quieter than the music. Only music you are allowed to use commercially. Master to \u221214 LUFS.\n\nENDING\nLand on an animated logo reveal with the tagline and URL. Hold the final frame long enough to register. No bouncing CTA.\n\nBANNED\n[PASTE THE PRESET'S BANNED LIST] Plus: anything that looks like a template, a PowerPoint, a screen recording, or five screenshots sliding around.\n\nQUALITY LOOP\nBefore the full render, show me the beat map and 4 stills. After rendering, check real frames yourself: does it look like an Apple-tier film? Anything overlapping, clipped, rushed or hard to read? Fix it, then render again. Every frame should be good enough to use as a still ad. I'd rather have 3 extraordinary moments than 10 mediocre ones.\n\nFORMAT\n[1920\u00d71080 / 1080\u00d71080 / 1080\u00d71920], 60 fps, MP4.\n```\n\nShort version (when you want the model to surprise you):\n```\nResearch [PRODUCT URL]. Make a dynamic [20]-second motion graphics launch video that shows what an incredible motion designer you are, like it's the hero video on the landing page. Use the real UI broken into parts, the real colors and fonts. Music at 120 BPM, every cut on the beat. Style: [PRESET NAME]. Go all out, but with ruthless restraint.\n```\n\n---\n\n## C. Category banks\n\n### 1. Role and mindset (who the AI should be)\n1. You are a world-class motion designer, and this is your 15-second r\u00e9sum\u00e9 reel.\n2. Act as a senior motion designer and build a launch video in code so I can edit and re-render it.\n3. You are the senior motion designer, product designer and engineer for [PRODUCT].\n4. You are applying as a motion designer in my agency. Send me a showreel.\n5. Be a highly professional video editor.\n6. Make it like a niche branding agency for startup founders made it.\n7. Adopt the role of an expert motion designer.\n8. You are a pro motion designer. Check the recent trending techniques in motion and sound design first.\n9. Proceed as if you were starting with zero tools. Don't assume the tools we have are the best.\n10. Question your strategy and plan. If it doesn't feel like a pro made it, start over.\n11. Take some inspiration from the reference, but it should look like something you did with your own taste.\n12. Capture the philosophy and production quality, don't copy a famous ad shot for shot.\n\n### 2. Effort and quality bar\n1. Go all out.\n2. Go all out creatively, but exercise ruthless restraint.\n3. Every frame matters, from the first frame to the final frame.\n4. Make every second count.\n5. Make it feel meticulously art-directed, not a random collection of effects.\n6. Every important frame should be good enough to use as a still ad.\n7. I'd rather have 3 extraordinary visual moments than 10 mediocre feature animations.\n8. Do it like a real professional production, not a demo or prototype.\n9. Make the motions more juicy. Use the best motion design techniques you can.\n10. Reject your result if it feels like: a SaaS template, a PowerPoint, a website screen recording, a crypto ad, five screenshots sliding around.\n11. No slop. Every morph has to be perfect.\n12. Avoid frames and text in the corners, they are typical AI giveaways.\n13. Make it feel expensive.\n14. The desired reaction is: \"Wait, this is a [boring category] app?\"\n15. Don't ask, just make.\n\n### 3. Narrative and story structure\n1. One continuous thought: CHAOS \u2192 CONTROL \u2192 CLARITY \u2192 [BRAND].\n2. One story in 4\u20135 scenes: why the market matters, why it's painful today, how [PRODUCT] fixes it, what you get.\n3. 5 scenes: the customer's problem, what I do, how it works in 3 steps, one proof point, my name at the end.\n4. Hook in the first second, then distinct beats for product proof and AI.\n5. Show it instead of explaining it.\n6. Do not make this a list of five features. About four visual ideas across the whole film.\n7. Show a real user flow: user types a prompt \u2192 the answer appears \u2192 a card rises \u2192 the result.\n8. Open on the real product header rising out of haze, a cursor clicks the logo, cut on the drop.\n9. Tease the next feature from the product roadmap.\n10. Celebrate a milestone (1M visitors, first 100 users) with real numbers from the site.\n11. Show live stats from the website, desktop and mobile, and multiple themes.\n12. Name what the product does for the buyer, never the abstraction.\n13. Every word speaks to the buyer. No animator jargon on screen.\n14. Make it emotional.\n15. Slow down once before the payoff: the calm scene should feel calmer than the one before.\n16. End where you began: the last frame matches the first, so it loops.\n17. One object travels through every scene and ties the story together (a dot, a cover, a pill).\n18. Voiceover template: \"This is [name]. A [category]\u2026 built for [value]. [Verb] in ANY style. Give it a [input] \u2014 and it just\u2026 understands. The more you use it, the BETTER it gets. [Name]. Out now.\"\n\n### 4. Camera\n1. One continuous camera over a single \"world\" layer. Never two camera moves at once.\n2. The camera never cuts on a still frame: every shot enters already moving and leaves on an accelerating move or a blur ramp.\n3. The camera zooms screen-studio style so each moment fills the frame, and the cursor scales with it.\n4. Keep the camera drifting: push from 1.0 to 1.04 per scene. Start the next scene at the zoom where the last one ended.\n5. Camera movement should feel like a high-end macro product shoot. Film the software like a physical premium object.\n6. Pull back from one full-bleed clip until it is just a card on the page.\n7. Whip into one tile until it is full-bleed. Corners go to 0 as it fills the screen.\n8. Push 1.5\u00d7 into the key text while the rest slides out.\n9. Whip-tilt up through a light flash into the next page.\n10. Zoom out until the desktop is a point in space, then zoom back in to a phone.\n11. Start on a single dot on black, then windows appear and the camera zooms in and out at many scales.\n12. Pan the content as the cursor moves, fastest in the middle of the move.\n13. Subtle perspective tilt during the entrance, settling to a front view.\n14. Camera tracks beneath an object until its underside fills the frame and becomes the next scene.\n15. Camera pushes through an interface element into the next screen.\n16. Smooth camera pushes and pans, depth and glow.\n17. Controlled motion blur during the fastest part of the zoom.\n18. Use one cursor that homes on the live button, because the camera keeps creeping during holds.\n19. When a shape fills the screen, scale it past all four corners.\n20. No sudden camera resets. If the camera snaps back to 1.0 during a handoff, the zoom jumps.\n21. No constant zooming. No camera shake.\n\n### 5. Motion (easing, timing, feel)\n1. Real easing only, no linear movement. Curves like cubic-bezier(0.16, 1, 0.3, 1).\n2. Critically damped springs or carefully tuned smooth easing. No repeated bouncing.\n3. Springs everywhere, a tiny overshoot at most. Overshoot below about 2%.\n4. Anticipation, overshoot, settling, motion continuation, shared speed between scenes.\n5. Elements should not all start and stop on the same frame. Use subtle stagger and overlap.\n6. Squash and stretch, stagger, overlap, onion skin, smear, follow-through.\n7. Every shot enters with an exponential ease-out (12\u201319% of the remaining distance per frame).\n8. Blur follows speed and direction on every move.\n9. Nothing appears instantly. Eased fades of at least 0.3 s. (A 0.05 s fade looks like a pop.)\n10. Icons pop from zero on a spring. Bars draw across. Charts draw themselves.\n11. Text rises out of a mask line.\n12. Kinetic typography word by word, elements build in on the beat instead of just appearing.\n13. The tab indicator's two edges ride different springs, so the leading edge stretches ahead.\n14. A slider stretches when dragged past max, then springs back from wherever it was.\n15. A cursor drives every change with real clicks, drags and long-presses. It grows on hover and shrinks when it presses.\n16. The cursor turns to face where it's going.\n17. Prompt types about 1 character per frame with a tiny hold every 2\u20133 characters. Caret always on.\n18. Magnetic alignment and precision: a document snaps into its matching record.\n19. Numbers should feel tactile and precise; values count up and settle.\n20. Treat a badge as a solid 3D object that tilts toward the cursor with real physics. Fast and smooth, not bouncy.\n21. Use controlled elastic movement for one element only.\n22. Allow at least one 400 ms moment of total stillness. Use a brief stillness to make a change feel earned.\n23. Change images on 16th notes, with a click for each.\n24. Motion needs weight.\n25. One primary move per transition. No generic push, slide or rotate-swing.\n26. Keep the motion sharp and controlled, small spring overshoots, no dead time.\n27. Motion that isn't connected to an element already on screen is banned.\n28. Rhythm that speeds up and slows down with the story.\n\n### 6. Transitions and scene connection\n1. Every scene is made out of the previous one: nothing fades, blurs or cuts. Objects change shape instead.\n2. \"Of course the next scene came from that.\"\n3. A card becomes the next card. A chart line becomes a connector. A receipt becomes a booking. A number becomes the amount on the invoice.\n4. A gold chart point expands into the corner of the next card and the camera follows it.\n5. A black shape floods the whole frame and contracts into the next scene (take about 0.3 s, scale past the corners).\n6. One hook word morphs into the product UI.\n7. A circle opens out of the button into a dark scene.\n8. Match cut: the last clip shrinks back into its own tile.\n9. A tile blooms into its full page.\n10. A pill lifts, relabels, and docks somewhere new.\n11. The icon collapses into a menu bar.\n12. Six iris blades close over the label and snap open onto a photo.\n13. The circle becomes a square, shrinks, and the grid unfolds from behind it like a paper map.\n14. A glass word melts into a droplet that stretches into a glass toolbar.\n15. The phone's Dynamic Island stretches like liquid, pinches off, and grows into a Mac window.\n16. One black shape keeps morphing: Ordered \u2713 \u2192 Printing % \u2192 On its way \u2192 Delivered \u2713.\n17. The wordmark squeezes into its own period, the dot grows into a pill, a label rises inside.\n18. The orange dot connects every scene: in the UI, over a letter, tracing a graph, growing into a shape, back on the end card.\n19. Covers converge to the center and fold around the logo, which emerges from the same spot.\n20. Blur-dissolve only between related shapes. Hard cuts only on the music drop.\n21. Mask reveals using the product's own shapes.\n22. Shared geometry, matching position, coordinated scaling.\n23. Under full cover, reset hidden elements so the loop restarts cleanly.\n24. Direct cuts only when a rhythmic hit benefits the film.\n25. Bad: crossfade, random wipe, spin, glitch, whip pan every two seconds, generic slide-left, zoom-blur spam.\n\n### 7. Typography\n1. One clean sans (Geist or Inter), tight tracking. Mono (Geist Mono / JetBrains Mono) for numbers and prompts.\n2. Very little copy. Headlines fit on one line, max 3\u20134 words.\n3. Typography should move as designed objects. Avoid every word animating on its own.\n4. Strong type may scale very large and become the transition itself.\n5. Huge kinetic type in a heavy display font (like Anton) for impact words.\n6. Handwriting font drawn on stroke by stroke.\n7. Two-line statements: first line white, second line in the brand color.\n8. Short masked vertical reveals.\n9. The one key word types in a gradient of brand colors, with a faint glow behind it.\n10. Giant bold titles made of frosted glass, cut off by the card's edge.\n11. Captions typed word by word at the exact time they're spoken.\n12. The hook lands word by word on the beats.\n13. Letters bend and move into place until only one word remains.\n14. Words orbit an object, then the ring opens out.\n15. Questions and answers large and bold.\n16. Text that swaps inside a moving shape needs its own enter and exit timing, or it overlaps.\n17. No full stops on screen. No eyebrow labels. No giant marketing paragraph.\n18. Text should feel like product advertising, not oversized presentation headings.\n\n### 8. Product UI treatment (SaaS-specific)\n1. Analyze my frontend and use the actual components from the product.\n2. Use actual product screenshots, logo and assets, but break them into parts so we can animate those too.\n3. Reconstruct, crop and layer the real UI so each region can animate on its own.\n4. The product UI is the hero.\n5. The hero number resolves crisply, the chart draws in, supporting metrics settle a bit later.\n6. Brand-accurate UI, type, color and motion.\n7. Capture the real pages (home, pricing, mobile view, dark mode) and animate them inside browser and phone frames.\n8. Use only facts and numbers that are on the site. No invented %, customer names or figures. Use clearly fake demo values when needed.\n9. Real logo only. Never redraw it, never a boxed logo file.\n10. Show the product's own chat answering real questions.\n11. A frosted glass prompt box springs out from under the icon and the prompt types.\n12. A persistent player bar (or nav) connects changing shots and stays secondary.\n13. Stylized desktop UI with a slim sidebar rises into view.\n14. Use real footage only, never placeholder cards.\n15. Keep the interface crisp. Don't blur the product to look cinematic.\n16. Learn the design system first: tokens, colors, fonts, icons.\n\n### 9. Style, color and light\n1. One accent color, used only for the highlight, the cursor halo and one dot.\n2. Warm off-white canvas, near-black backgrounds, bold type, one vivid accent.\n3. Three colors and the site's own fonts.\n4. Paper-light canvas with marker accents; dark mode = charcoal matching the palette.\n5. Soft, white, bright blue, glassy. Apple-keynote feel.\n6. Dark metal, warm gold, glass, ink, precision, quiet confidence.\n7. A dark rounded stage inside a soft atmospheric brand-color background.\n8. Soft gold rim light, dark navy falloff, faint bloom, a soft highlight passing across a surface.\n9. Slow pastel aura in brand colors behind glass.\n10. An art reimagine: bold, light mode. Paint elements on top of the images.\n11. Clean and perfect: no beige \"artsy\" look.\n12. Consistent icon strokes and restrained shadows.\n13. A white shape vanishes on a white page without a 1 px edge and a faint shadow.\n14. Keep compositions compact and centered, with lots of negative space.\n15. One idea per shot, key objects centred, space to breathe.\n16. Psychedelic and hypnotic (for loud versions).\n17. Risograph / oscilloscope / Swiss / engraving / pixel art / shadow theatre (named looks the site used well).\n18. Banned looks: generic AI purple, rainbow gradients, neon, cyberpunk, grid floors, lens flares.\n\n### 10. Sound and music sync\n1. Music around 120 BPM, with a clear drop. Cut every scene on the beat.\n2. Every cut sits on a downbeat, every UI hit on a beat.\n3. Analyze the song for tempo, beat grid, energy and the drop. Line the grid up with the real kick drums.\n4. Score the music so every cut, hit and scene change lands on a beat or drop; retime until synced.\n5. Land the zoom on the drop. Put the calm scene in the breakdown. Bring the logo back on the beat.\n6. Drums drop on the dark switch, slam back on the type and the logo.\n7. One soft sound effect for every element that appears, silence otherwise.\n8. Sound kit: pops, pen scribbles, whooshes, clicks, key ticks, soft landings, a sub-hit on the logo.\n9. Place each sound so its loudest point, not its file start, lands on the event.\n10. Reversed whooshes into the hits.\n11. Premium, kinetic, sophisticated, not frantic: low soft impact, restrained UI clicks, a metallic/glass tick, an elegant resolved tone at the logo.\n12. Avoid: trailer booms, EDM risers, whooshes everywhere, stock \"tech\" sounds, aggressive bass.\n13. Duck the music under the voice so the voice sits clearly above it.\n14. Only music and sounds you're allowed to use commercially (Mixkit, Pixabay, or made in code).\n15. It must work without sound, too.\n16. Master to \u221214 LUFS.\n\n### 11. Pacing and duration\n1. 15 s for social, 20\u201330 s for a landing page hero, 60\u201390 s for an explainer.\n2. A new idea every 1.5\u20132 s (loud) or about 1 s per idea with smooth transitions (clean).\n3. Something happens on every beat.\n4. Keep each scene on screen long enough to read.\n5. The first 1.5 seconds must already look premium.\n6. Final frame must have enough stillness to register.\n7. Holds no longer than 1 s (loud) / one deliberate hold only (clean).\n8. Avoid long blank gaps and dead holds.\n\n### 12. Ending and logo\n1. End on a memorable animated logo reveal with the tagline and URL.\n2. The UI folds into one product object; darkness returns; the wordmark resolves; one short line under it.\n3. The icon moves slightly left and settles beside the wordmark. Keep them apart through the move.\n4. Hard cut to a black end card with a glowing wordmark that slowly shrinks.\n5. 120 images burst out and come back together into the logo as the name types on. \"Out now\" underneath, hold 2 s.\n6. A tiny glint reveals the mark. No generic logo fade.\n7. End on the website and contact email.\n8. No giant bouncing CTA.\n\n### 13. Working process (ask the AI to do this)\n1. Ask me for the inputs, then show me a storyboard with every timing on the beat grid before writing code.\n2. Show me the beat map and 4 stills before the full film.\n3. Write a storyboard with exact times, key visual, transition logic, copy and emotional rhythm.\n4. Render frames at fixed times and look at them yourself. Don't stop because it rendered.\n5. Check: does this look Apple-tier? Anything look like a template? Too much on screen? Product readable? Transitions connected?\n6. Scan for single-frame pops and frozen frames.\n7. Have a fresh critic who didn't build it review the render, then fix what it finds.\n8. Make a contact sheet of stills before showing me anything.\n9. Deliver: final film, poster frame, contact sheet, and the source so it can be re-rendered.\n10. Then make a vertical version that is re-composed, not just cropped.\n\n### 14. Technical build (for the AI, keeps quality high)\n1. Every frame is a pure function of time (seek(t)): no CSS transitions, timers or random values.\n2. Render frame by frame with a headless browser, then join into an MP4 with real motion blur (blend 3\u20138 sub-frames).\n3. 60 fps, 1920\u00d71080 (or 1080\u00d71080 square, 1080\u00d71920 vertical).\n4. Keep every timing in one timeline file, every word in one copy file.\n5. Load fonts before measuring text.\n6. Remotion or HyperFrames are both used on the site for editable, re-renderable films.\n\n---\n\n### 15. More lines from GitHub, X and the pro skill (same categories)\n\n**Role and effort**\n1. Act as a world-class animator.\n2. Make it feel like a professional motion-design studio made it, not \"AI video\".\n3. Don't hand me a first draft. Hand me something you'd put your name on.\n4. I'm stepping away. Work on your own until it's done; make the calls yourself and tell me what you decided at the end.\n5. Showreel stakes: if this is weak, you don't get hired.\n6. Make it less like a PowerPoint. (The single most useful note people gave in round two.)\n7. Research the product first. Visit the pages, then write the video content yourself.\n8. Proceed as if you have zero of my tools; pick the best ones.\n9. The goal is a memorable showreel, not a slideshow of feature bullets.\n\n**Story**\n1. Every transition should show a feature in action, not just swap one title card for another.\n2. Hook: a single cursor blinks, sends one signal, and it grows into the whole product.\n3. Write a 1-line problem, audience, goal and emotion first. Then pick the ONE true moment the film is for.\n4. Write at least 3 ideas of different kinds (a UI story of one task, a held shot, a joke with a character, a type essay, a real-output montage). Pick one and say why.\n5. Cover the logo: if a competitor could use the same film, the idea is wrong.\n6. Each beat must \"buy\" one belief: \"This beat makes the viewer believe ___.\" If you can't fill it, cut the beat.\n7. Show it, then say it: a claim in words is followed by the product doing it.\n8. A visual anchor runs through the film (one character's eyes, one dot, one album cover) and lands on the real logo at the end.\n9. Lock the message: exact lines, exact order, no extra slogans.\n10. Avoid: \"Not just X. It's Y.\", \"Unlock\", \"Meet X\", \"the future of\", triplets of one-word sentences.\n\n**Camera**\n1. Motion should feel slow and polished: camera moves of 1.5\u20133 s on gentle ease-in-out, about half the speed you'd default to.\n2. One camera only. Only punch-ins (1.0 \u2192 1.08) and side smash-pans timed to beats, never random drift.\n3. Use a camera with position and log-space zoom. Put scenes side by side in one world so pans really travel.\n4. The camera dives into a point until it fills the frame and becomes the next scene.\n5. Size camera moves by length: 1.25\u00d7 for a quick punch, 1.4\u00d7 for half a second, 1.5\u00d7 for 1\u20131.5 s, 2.4\u00d7 only for slow drifts.\n6. Camera pulls (zoom out) speed up into the cut; pushes (zoom in) slow down as they land.\n7. A big dive from logo into product: start at once, speed up for 0.4 s, then slow down, about 22\u00d7 total.\n\n**Motion**\n1. Content enters after its container starts changing shape, and leaves before the next change, so text never overlaps.\n2. Never fade black straight into the accent color. Move an accent object between states instead.\n3. Per-letter springs for kinetic type, 1/16 note apart at 120 BPM (125 ms).\n4. Letters scramble, then snap into place on the beat.\n5. Landing slows down; leaving speeds up. Typical move: 0.33\u20130.4 s. Fades: only 0.2 s, as a helper.\n6. Things arrive by moving, not by fading. A pure fade-in is the AI default.\n7. Things arrive bigger and settle down (a logo crashes in from 3.5\u00d7 size). Nothing grows from zero.\n8. Only one visible spring in the whole film. Overshoot is rare, small and late.\n9. Groups of items arrive 1\u20133 frames apart, unevenly, each move about twice as long as the gap.\n10. A held frame keeps one living thing: a slow drift, a caret, light moving.\n11. The cursor parks before it acts. A press squashes for 2\u20133 frames and the button answers a frame later.\n12. Keep the cursor attached to what it drags, even when that thing stretches.\n13. Counters swap whole values under motion blur, or they smear.\n\n**Transitions**\n1. The outgoing word becomes the mask that reveals the next word.\n2. Grow a flood circle from the point that caused it to the farthest corner in about 0.4 s.\n3. Check dot splits into three typing dots with goo, then back into one.\n4. A shape bends into a play triangle one point at a time.\n5. A slider dragged past max rubber-bands and pulls the camera into the next scene.\n6. Build transitions from shapes already in the film (the logo's own mark, the brand color grid), never a generic wipe.\n7. Cut on motion, never on rest. The next scene starts already moving.\n8. Plan both sides of every cut together: last frame of A and first frame of B (object, place, size, color, speed).\n9. Cut every 0.3\u20132.3 s inside a scene; shorten scenes toward the end and let the last one linger.\n\n**Type**\n1. Use a type system: one display face for 1\u20134 word shouts, one secondary, one mono for tiny labels.\n2. Display tracking tight (\u221240 to \u221280); mono a bit wide (+20).\n3. Words arrive whole, 2\u20135 frames apart, at speech rhythm. Letter-by-letter typing only inside the product's own input box.\n4. Headlines about 9% of frame height; hero numbers about 25%, used once.\n5. Captions measured in the real font and shrunk to fit the 9:16 safe zone, so nothing hides under TikTok buttons.\n6. All on-screen copy lowercase (if the brand writes that way).\n\n**Product UI**\n1. Rebuild the app's UI in code from its real design tokens. Zero screenshots needed.\n2. Let the AI log in, use the app, write a feature list (including what we must not claim), and take its own screenshots (desktop, phone, cut-out parts).\n3. Show a magnified piece of the real UI, cropped by the frame edge, never a small card floating on empty space.\n4. Real UI. Real data. No placeholders. No made-up names or numbers.\n5. Only state what's true: don't call a beta \"stable\", don't show planned features as shipped.\n\n**Sound**\n1. Compose the soundtrack yourself in code. Every cut lands on the beat.\n2. Before the drop, play the song through a low-pass filter so it sounds like it's in the next room; open it on the drop.\n3. 1\u20133 hand-picked big hits (the click, the name, the turn), not a hit on every cut.\n4. Silence right before the biggest moment.\n5. Pull the music down while the viewer reads.\n6. Make the music with Suno, then give the song and the prompt to the AI: \"Make a beat-synced motion graphics music video for this track. Go all out.\"\n\n**Ending**\n1. End card holds only 0.6\u20131.4 s. A long static end card reads as \"the film gave up\".\n2. The ending is usually smaller and quieter than the climax.\n3. Avoid the web-footer ending (logo + tagline + button + URL held for seconds).\n4. End mid-motion, or on one designed still moment.\n\n**Process**\n1. Render about 20 stills, tile them into one contact sheet, and check the whole cut at a glance before rendering video.\n2. Keep the 30 s, 15 s and 6 s cuts, in 16:9 and 9:16, in one project (each is just a different list of scenes).\n3. Put every timing in one place and make everything follow it (rameerez's tip: \"parameterize everything\", or changing one scene breaks the rest).\n4. Give it 1 or 2 reference videos. Tile their frames into one image to study the pacing.\n5. Pin ONE design style file. Feeding it 2,000 styles makes it average them.\n6. Describe every frame of the contact sheet in one sentence. Would it pass as a slide? Then it's not done.\n\n**Reality check (rameerez, 1.7K likes):** many \"one prompt\" videos on X were bait. A good film usually takes several rounds of notes. Plan for that.\n\n---\n\n## D. Quick picks for SaaS (best whole prompts on the site)\n\n- **twoclipping \u2014 UGC ad generator promo**: high-end minimal, banned list, 10 bars at 120 BPM. Best \"clean\" template.\n- **twoclipping \u2014 Photo print app launch film**: one continuous take, everything morphs. Best \"transitions\" template.\n- **demonugc / twoclipping \u2014 Morphing UI states loop**: best micro-interaction loop.\n- **ultimaxbt \u2014 Orange dot motion system**: one object ties every scene.\n- **rossaxbt \u2014 Ora 2 launch film**: best AI-lab glass look with voiceover.\n- **notdwd \u2014 Frame by Frame launch**: frame-exact Apple-keynote sting.\n- **daniel-haida \u2014 Taxtello film**: best \"dark premium, restraint\" brief and quality checklist.\n- **aschapmann \u2014 SaaS launch video**: best short all-in-one paragraph.\n- **ik-builds \u2014 Paper-style product launch**: best playful template with rules.\n- **brainextends \u2014 Spotify product film**: best timeline-by-second example.\n\nMore strong whole prompts (GitHub and X):\n- **ultimaxbt \u2014 one continuous take loop** (your pick #6): chat bubbles, play button, swipe, chart, dive. Square, 22 s.\n- **chungmuromafia \u2014 all-purpose Apple showreel** (your pick #3): \"make a dynamic 20-second apple showreel style motion graphics video about introducing {Product Name} that shows what an incredible motion designer you are, like it's your showreel for a r\u00e9sum\u00e9. go all out. {Product Name}: {Product Description}\"\n- **verbove \u2014 product story as one shape**: 8\u201312 real UI states, real data, 120 BPM, every aspect ratio.\n- **annacher \u2014 ad tool as one morphing shape**: the UI-states template filled in for a real SaaS (a good worked example).\n- **techhalla \u2014 kinetic identity bumper**: strict 3-color palette, 3-font type system, locked message, banned list.\n- **HowDevelop \u2014 TanStack AI launch**: second-by-second plan where each transition shows a feature.\n- **jake11moran \u2014 notch browser teaser**: slow camera over one Mac desktop, real app windows.\n- **l3d1c \u2014 launch ad**: contact sheet review, 9:16 safe captions, 30/15/6 s cuts from one project.\n\n---\n\n## E. Ready prompt for Roommie (your style)\n\nShort version, one paste:\n```\nResearch https://roommie.app first: the real screens, colors, fonts and logo. Then make a 20-second Apple-keynote launch film for Roommie: describe a room, get the drawings.\n\nOne continuous take, no cuts. Every scene grows out of the last one. A real macOS cursor types a room description into Roommie's real prompt box, clicks, and the box morphs into the floor plan drawing itself line by line. The plan lifts into the next view, and the camera glides between them in one world. Warm light stage, black UI, Roommie's own accent color, Roommie's own font. Each morph about 0.8 s, the camera follows the same curve. Music around 120 BPM: muffled before the click, opening up on the drop when the plan appears. One soft sound per action. End on the Roommie logo for about 1 second, last frame = first frame.\n\nUse only real Roommie screens and features. No made-up numbers or users. Banned: hard cuts, crossfades, bouncy springs, particles, glows, holds over 1 s, anything that looks like a template or a slide.\n\nShow me the beat map and 4 stills before the full render. Then check the frames yourself and fix anything that overlaps, clips or feels rushed.\n```\n\nFull version (your picked template, filled in for Roommie):\n```\n<inputs>\nAsk me for: one room description a user types into Roommie, 2\u20133 real Roommie result screens (floor plan, any 3D or export view), Roommie's logo, and a royalty-free song around 110\u2013120 BPM with a quiet intro and a hard drop (Mixkit, free for commercial use). If I skip anything, capture them from https://roommie.app.\n</inputs>\n\n<direction>\nA 20-second square loop, 1440x1440 at 60fps. 2D only, one continuous take. Nothing cuts: each scene grows from the one before it, and every gesture carries the camera into the next space. Each morph takes 0.8s on cubic-bezier(.45,0,.15,1). The camera zoom follows the same curve. Content dissolves during the second half of each glide. One gesture per scene.\nLook: a warm light stage (#f3f3f0 to #e3e3de), black UI, Roommie's own accent color and font, the real macOS pointer, soft layered shadows that grow as shapes lift.\nBanned: hard cuts, bouncy springs, particles, glows, zooming in and immediately back out, holds longer than 1s, made-up UI or numbers, anything that feels like a template.\n</direction>\n\n<structure>\nFollow the song's beats. The click lands on the drop.\nType: the cursor clicks Roommie's prompt box. The room description types in, about one character per frame.\nGenerate: the send button glides into a spinner, then becomes a check.\nPlan: the check opens into a blank sheet. On the drop, the floor plan draws itself wall by wall, then doors, then labels.\nExplore: the cursor drags across the plan. The camera follows into the next view (3D or export), moving through one world.\nEnding: the plan folds into a line that fans out into the Roommie logo. Hold about 1 second. The logo folds back into the prompt box. Last frame = first frame.\n</structure>\n\n<build>\n1. One HTML canvas. Everything is computed from time inside seek(t): no timers or state carried between frames.\n2. A camera with position and log-space zoom. Scenes sit side by side in one world.\n3. Floods grow from the point that caused them to the farthest corner in about 0.4s.\n4. Sound: low-pass the song before the click so it feels like the next room; open it on the drop. One SFX per event, placed by its measured peak. Loudnorm to -14 LUFS.\n5. Render with Playwright at 60fps with 4 motion-blur subframes. Scan for single-frame jumps and fix them.\n</build>\n\n<gotchas>\nA handoff between two drawings pops unless the first has fully landed. Keep the cursor attached to whatever it drags. Text inside a morphing shape needs its own timing or it overlaps.\n</gotchas>\n\n<start>\nAsk me for the inputs, then show me the beat map and 4 stills (type, plan, explore, logo) before rendering.\n</start>\n```\n\n---\n\n## F. Pro timing cheat sheet (measured on 53 real studio films)\n\n- Typical move: **0.33\u20130.4 s**. Fades: **0.2 s**. Blur clearing: **0.23 s**.\n- Landing **slows down**, leaving **speeds up**.\n- Overshoot on under 9% of moves, small and late. **One** visible spring per film.\n- Things arrive **bigger and settle down**. Nothing grows from zero.\n- Groups arrive **1\u20133 frames apart**, unevenly.\n- Cuts every **0.3\u20132.3 s**. Cut **on motion**, never on a still frame.\n- A held frame always has **one living thing**.\n- A planned pause of **0.6\u20131.5 s** right before the big moment is good.\n- End card **0.6\u20131.4 s**. The final shot is at most a quarter of the film.\n- UI text at least **4% of frame height**, so it reads on a phone.\n- Never ship: corner labels, scene counters (\"02 / SPEAK\"), timecodes, a big headline on the left with a phone on the right, a stat slide, fake UI cards, a web-footer ending.\n\nThe full skill is in `raw/github/motionmaxxing`. It can be installed so the AI follows these rules by itself.\n\n---\n\n## G. Helpers people recommend\n\n- **whatships.com**: 2,000+ real product launch videos. Pick one in your category as a reference.\n- **styles.refero.design** and the \"awesome-design-md\" list: a brand's colors, type and spacing as one file the AI can follow.\n- **kinetics.colorion.co**: spring animations with ready-made prompts.\n- **HyperFrames** (hyperframes.dev) or **Remotion**: the tools that turn the AI's code into an MP4. Both are used across the best films.\n- **Suno**: make the song first, then let the AI cut to it.\n\nNot reached: Charlie Hills' \"389 videos\" library. His post doesn't show the link, and the GitHub list (513 videos) covers the same wave.\n\nRaw data is next to this file: `all-prompts.txt` (site), `github-new-prompts.txt` (GitHub), `raw/x-posts*.txt` (X).\n";

 document.querySelectorAll('main h3').forEach(h=>h.classList.toggle('hide',!!v&&!h.closest('.preset')));});
// active nav
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){nav.querySelectorAll('a').forEach(a=>a.classList.toggle('on',a.hash==='#'+e.target.id))}}),{rootMargin:'-40% 0px -55% 0px'});
document.querySelectorAll('section').forEach(s=>io.observe(s));
</script>

</body></html>
